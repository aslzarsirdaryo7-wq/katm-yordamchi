name: Kunlik vazifalar

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  yuborish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vazifalarni yuborish
        run: python send.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
